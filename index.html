<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>待办事项</title>
    <style>
        body { font-family: system-ui; max-width: 600px; margin: 50px auto; padding: 20px; }
        .todo-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .completed span { text-decoration: line-through; color: #999; }
        input[type="text"] { padding: 8px; width: 60%; }
        button { padding: 8px 16px; }
        select { padding: 8px; margin-right: 10px; }
        ul { list-style: none; padding: 0; }
        .delete-btn { color: red; cursor: pointer; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .category-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 8px;
        }
        .category-work { background: #e3f2fd; color: #1565c0; }
        .category-life { background: #f3e5f5; color: #7b1fa2; }
        .category-study { background: #e8f5e9; color: #2e7d32; }
        .category-other { background: #fff3e0; color: #e65100; }
        .filter-bar { margin-bottom: 15px; padding: 10px; background: #f5f5f5; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>待办事项列表</h1>

    <div class="filter-bar">
        <label>筛选分类：</label>
        <select id="filterCategory" onchange="render()">
            <option value="all">全部</option>
            <option value="work">工作</option>
            <option value="life">生活</option>
            <option value="study">学习</option>
            <option value="other">其他</option>
        </select>
    </div>

    <div>
        <input type="text" id="todoInput" placeholder="输入新事项...">
        <select id="todoCategory">
            <option value="work">工作</option>
            <option value="life">生活</option>
            <option value="study">学习</option>
            <option value="other" selected>其他</option>
        </select>
        <button onclick="addTodo()">添加</button>
    </div>
    <ul id="todoList"></ul>

    <script>
        const CATEGORIES = {
            work: { name: '工作', class: 'category-work' },
            life: { name: '生活', class: 'category-life' },
            study: { name: '学习', class: 'category-study' },
            other: { name: '其他', class: 'category-other' }
        };

        let todos = JSON.parse(localStorage.getItem('todos') || '[]');

        function getCategoryLabel(category) {
            const cat = CATEGORIES[category] || CATEGORIES.other;
            return `<span class="category-tag ${cat.class}">${cat.name}</span>`;
        }

        function render() {
            const filter = document.getElementById('filterCategory').value;
            const list = document.getElementById('todoList');

            const filtered = filter === 'all'
                ? todos
                : todos.filter(t => t.category === filter);

            list.innerHTML = filtered.map((todo, i) => `
                <li class="todo-item ${todo.done ? 'completed' : ''}">
                    <span>
                        <input type="checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo(${i})">
                        ${todo.text}
                        ${getCategoryLabel(todo.category)}
                    </span>
                    <span class="delete-btn" onclick="deleteTodo(${i})">删除</span>
                </li>
            `).join('');
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            const category = document.getElementById('todoCategory').value;
            if (input.value.trim()) {
                todos.push({ text: input.value.trim(), done: false, category: category });
                localStorage.setItem('todos', JSON.stringify(todos));
                input.value = '';
                render();
            }
        }

        function toggleTodo(index) {
            todos[index].done = !todos[index].done;
            localStorage.setItem('todos', JSON.stringify(todos));
            render();
        }

        function deleteTodo(index) {
            todos.splice(index, 1);
            localStorage.setItem('todos', JSON.stringify(todos));
            render();
        }

        // 兼容旧数据：为没有 category 的事项添加默认分类
        todos = todos.map(t => ({ ...t, category: t.category || 'other' }));
        localStorage.setItem('todos', JSON.stringify(todos));

        render();
    </script>
</body>
</html>
